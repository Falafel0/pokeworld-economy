plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

group = project.group
version = "${project.minecraft_version}-${project.mod_version}"
base.archivesName = project.archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

runs {
    client {
        client()
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_name
    }
    server {
        server()
        programArgument '--nogui'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_name
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: "[${minecraft_version},1.22)",
        neo_version            : neoforge_version,
        neo_version_range      : "[${neoforge_version},)",
        loader_version_range   : "[4,)",
        mod_name               : mod_name,
        mod_version            : mod_version
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName}" }
    }
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
}
