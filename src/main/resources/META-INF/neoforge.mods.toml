[[mods]]
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods.mods]]
modId="${mod_name}"
version="${mod_version}"
displayName="PokeWorld Economy Integration"
description='''
Full CobbleDollars + Numismatic Overhaul integration for PokeWorld.
Unifies wallet, fixes exploits, enables MCA coin payments.
'''

[[dependencies.pokeworld_economy]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.pokeworld_economy]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.pokeworld_economy]]
    modId="cobbledollars"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.pokeworld_economy]]
    modId="numismaticoverhaul"
    type="required"
    versionRange="[4.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.pokeworld_economy]]
    modId="mca"
    type="optional"
    versionRange="[7.7.0,)"
    ordering="AFTER"
    side="BOTH"
